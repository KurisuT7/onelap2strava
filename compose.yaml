name: onelap2strava

services:
  bot:
    image: ghcr.io/kurisut7/onelap2strava:0.2.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
