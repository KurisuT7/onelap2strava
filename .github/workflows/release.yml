name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/kurisut7/onelap2strava

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve and verify version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$VERSION" = "$PROJECT_VERSION"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test and build Python distributions
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy
          pytest --cov --cov-report=term-missing
          python -m build
          python -m twine check dist/*
          python scripts/prepare_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --dist-dir dist \
            --output-dir release
      - name: Verify the built wheel
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python -m venv "$RUNNER_TEMP/onelap2strava-wheel"
          "$RUNNER_TEMP/onelap2strava-wheel/bin/python" -m pip install \
            "onelap2strava[bot,strava] @ file://$GITHUB_WORKSPACE/dist/onelap2strava-$VERSION-py3-none-any.whl"
          test "$("$RUNNER_TEMP/onelap2strava-wheel/bin/onelap2strava" --version)" = "$VERSION"
          smoke_dir="$RUNNER_TEMP/onelap2strava-wheel-smoke"
          mkdir -p "$smoke_dir"
          SMOKE_DIR="$smoke_dir" python -c 'import os; from pathlib import Path; from tests.fit_factory import make_fit; Path(os.environ["SMOKE_DIR"], "input.fit").write_bytes(make_fit())'
          "$RUNNER_TEMP/onelap2strava-wheel/bin/onelap2strava" convert \
            "$smoke_dir/input.fit" \
            --output "$smoke_dir/output.fit"
          test -s "$smoke_dir/output.fit"
      - name: Verify the native container image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="$IMAGE_NAME:$VERSION-test"
          smoke_dir="$RUNNER_TEMP/onelap2strava-container-smoke"
          mkdir -p "$smoke_dir"
          SMOKE_DIR="$smoke_dir" python -c 'import os; from pathlib import Path; from tests.fit_factory import make_fit; Path(os.environ["SMOKE_DIR"], "input.fit").write_bytes(make_fit())'
          chmod 0777 "$smoke_dir"
          docker build --build-arg VERSION="$VERSION" --tag "$IMAGE" .
          test "$(docker run --rm "$IMAGE" --version)" = "$VERSION"
          docker run --rm \
            --mount "type=bind,src=$smoke_dir,dst=/work" \
            "$IMAGE" convert /work/input.fit --output /work/output.fit
          test -s "$smoke_dir/output.fit"
          VOLUME="onelap2strava-release-$GITHUB_RUN_ID"
          docker volume create "$VOLUME"
          trap 'docker volume rm "$VOLUME" >/dev/null 2>&1 || true' EXIT
          docker run --rm --mount "type=volume,src=$VOLUME,dst=/data" --entrypoint sh "$IMAGE" \
            -c 'test "$(id -u)" = 10001 && test -w /data && touch /data/write-test && rm /data/write-test'
          docker volume rm "$VOLUME"
          trap - EXIT
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and push multi-platform image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s  %s\n' "${{ steps.image.outputs.digest }}" "$IMAGE_NAME" > release/IMAGE_DIGEST
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            release/*.zip \
            release/SHA256SUMS \
            release/IMAGE_DIGEST \
            --draft \
            --verify-tag \
            --title "onelap2strava ${{ steps.version.outputs.version }}" \
            --notes-file release/RELEASE_NOTES.md
