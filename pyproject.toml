[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "onelap2strava"
version = "0.1.0"
description = "Convert GCJ-02 coordinates in FIT activities and upload them to Strava."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fit", "gcj-02", "wgs84", "strava", "onelap", "telegram-bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
strava = ["httpx>=0.28,<1"]
bot = ["httpx>=0.28,<1"]
dev = [
    "build>=1.2,<2",
    "garmin-fit-sdk>=21.170,<22",
    "httpx>=0.28,<1",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
    "twine>=6,<8",
]

[project.scripts]
onelap2strava = "onelap2strava.cli:main"

[project.urls]
Repository = "https://github.com/KurisuT7/onelap2strava"
Issues = "https://github.com/KurisuT7/onelap2strava/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/CHANGELOG.md",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/onelap2strava"]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
pretty = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["onelap2strava"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
